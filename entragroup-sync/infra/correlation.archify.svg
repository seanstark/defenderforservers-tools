<svg xmlns="http://www.w3.org/2000/svg" width="1245" height="424" viewBox="0 0 1245 424" role="img" lang="en" aria-labelledby="archify-corr-title archify-corr-desc" data-animation="trace" data-preset="signal-flow" data-quality-profile="showcase">
  <style>
  /* <![CDATA[ */
    :root, [data-theme="dark"] {
      --bg: #020617;
      --grid: #1e293b;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --mask: #0f172a;
      --lane-fill: rgba(15, 23, 42, 0.35);
      --lane-stroke: #334155;
      --frontend-fill: rgba(8, 51, 68, 0.45);
      --frontend-stroke: #22d3ee;
      --backend-fill: rgba(6, 78, 59, 0.45);
      --backend-stroke: #34d399;
      --cloud-fill: rgba(120, 53, 15, 0.35);
      --cloud-stroke: #fbbf24;
      --security-fill: rgba(136, 19, 55, 0.45);
      --security-stroke: #fb7185;
      --messagebus-fill: rgba(251, 146, 60, 0.35);
      --messagebus-stroke: #fb923c;
    }
    svg { font-family: "Segoe UI", Aptos, Calibri, -apple-system, sans-serif; }
    .c-grid { stroke: var(--grid); fill: none; opacity: 0.45; }
    .c-mask { fill: var(--mask); }
    .c-region { fill: var(--lane-fill); stroke: var(--lane-stroke); stroke-dasharray: 5 4; }
    .c-cloud { fill: var(--cloud-fill); stroke: var(--cloud-stroke); }
    .c-backend { fill: var(--backend-fill); stroke: var(--backend-stroke); }
    .c-messagebus { fill: var(--messagebus-fill); stroke: var(--messagebus-stroke); }
    .c-security { fill: var(--security-fill); stroke: var(--security-stroke); }
    .c-frontend { fill: var(--frontend-fill); stroke: var(--frontend-stroke); }
    .t-primary { fill: var(--text); }
    .t-muted { fill: var(--text-muted); }
    .t-cloud { fill: var(--cloud-stroke); }
    .t-backend { fill: var(--backend-stroke); }
    .t-messagebus { fill: var(--messagebus-stroke); }
    .t-security { fill: var(--security-stroke); }
    .t-frontend { fill: var(--frontend-stroke); }
    .a-emphasis { stroke: #34d399; fill: none; }
    .a-messagebus { stroke: #fb923c; fill: none; }
    .a-cloud { stroke: #fbbf24; fill: none; }
    .a-security { stroke: #fb7185; fill: none; stroke-dasharray: 5 3; }
    .m-emphasis { fill: #34d399; }
    .m-messagebus { fill: #fb923c; }
    .m-cloud { fill: #fbbf24; }
    .m-security { fill: #fb7185; }
  /* ]]> */
  </style>
  <title id="archify-corr-title">4-Tier Microsoft Entra ID Device Correlation Chain</title>
  <desc id="archify-corr-desc">Tier 1: MDE AadDeviceId -> Tier 2: Azure Machine Configuration intuneDeviceId (GuestConfigurationResources) -> Tier 3: MDE Synthetic Device ID (SHA-256 folded SenseId) -> Tier 4: MicrosoftSense Hostname and OS Fallback</desc>
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-messagebus" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-cloud" />
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
    </marker>
    <pattern id="corr-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1245" height="424" fill="#020617" />
  <rect width="1245" height="424" fill="url(#corr-grid)" />

  <!-- Correlation Chain Boundary Frame -->
  <rect x="305" y="14" width="315" height="396" rx="12" class="c-region" stroke-width="1.2"/>
  <text x="462.5" y="401" class="t-muted" font-size="8.5" font-weight="600" text-anchor="middle">Priority Order: Tier 1 -&gt; Tier 2 -&gt; Tier 3 -&gt; Tier 4 (SYNC_DISABLED_CORRELATION_TIERS)</text>

  <!-- Connectors from Server to Tiers 1, 2, 3, 4 -->
  <path d="M 235 208 L 268 208 Q 278 208 278 198 L 278 73 Q 278 63 288 63 L 330 63" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M 235 208 L 268 208 Q 278 208 278 198 L 278 169 Q 278 159 288 159 L 330 159" class="a-messagebus" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <path d="M 235 208 L 268 208 Q 278 208 278 218 L 278 245 Q 278 255 288 255 L 330 255" class="a-cloud" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <path d="M 235 208 L 268 208 Q 278 208 278 218 L 278 341 Q 278 351 288 351 L 330 351" class="a-security" stroke-width="1.6" marker-end="url(#arrow-rose)"/>

  <!-- Fallback arrows between Tier 1 -> Tier 2 -> Tier 3 -> Tier 4 -->
  <path d="M 462.5 96 L 462.5 126" class="a-messagebus" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow-orange)"/>
  <rect x="408" y="103" width="109" height="14" rx="3" class="c-mask"/>
  <text x="462.5" y="113" class="t-messagebus" font-size="7.5" font-weight="600" text-anchor="middle">If AadDeviceId empty</text>

  <path d="M 462.5 192 L 462.5 222" class="a-cloud" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow-amber)"/>
  <rect x="400" y="199" width="125" height="14" rx="3" class="c-mask"/>
  <text x="462.5" y="209" class="t-cloud" font-size="7.5" font-weight="600" text-anchor="middle">If GC not reported yet</text>

  <path d="M 462.5 288 L 462.5 318" class="a-security" stroke-width="1.3" marker-end="url(#arrow-rose)"/>
  <rect x="394" y="295" width="137" height="14" rx="3" class="c-mask"/>
  <text x="462.5" y="305" class="t-security" font-size="7.5" font-weight="600" text-anchor="middle">If synthetic ID not found</text>

  <!-- Connectors from Tiers 1, 2, 3, 4 to Verified Entra ID Device -->
  <path d="M 595 63 L 638 63 Q 648 63 648 73 L 648 198 Q 648 208 658 208 L 690 208" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M 595 159 L 638 159 Q 648 159 648 169 L 648 198 Q 648 208 658 208 L 690 208" class="a-messagebus" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <path d="M 595 255 L 638 255 Q 648 255 648 245 L 648 218 Q 648 208 658 208 L 690 208" class="a-cloud" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <path d="M 595 351 L 638 351 Q 648 351 648 341 L 648 218 Q 648 208 658 208 L 690 208" class="a-security" stroke-width="1.6" marker-end="url(#arrow-rose)"/>

  <!-- Connector from Verified Entra Device to Cloud x OS Group -->
  <path d="M 925 208 L 995 208" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="933" y="188" width="54" height="14" rx="3" class="c-mask"/>
  <text x="960" y="198" class="t-backend" font-size="8" font-weight="600" text-anchor="middle">Object ID</text>

  <!-- Node 1: Discovered Cloud Server -->
  <g id="node-server_input">
    <rect x="25" y="175" width="210" height="66" rx="8" class="c-mask"/>
    <rect x="25" y="175" width="210" height="66" rx="8" class="c-cloud" stroke-width="1.5"/>
    <text x="130" y="198" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">1. Discovered Cloud Server</text>
    <text x="130" y="214" class="t-muted" font-size="9" text-anchor="middle">Azure Arc · Native VM · VMSS</text>
    <text x="130" y="228" class="t-cloud" font-size="7.5" font-weight="600" text-anchor="middle">MDE DeviceInfo Matched (&lt;=7d / 168h)</text>
  </g>

  <!-- Node 2: Tier 1 MDE AadDeviceId -->
  <g id="node-tier1_aad">
    <rect x="330" y="30" width="265" height="66" rx="8" class="c-mask"/>
    <rect x="330" y="30" width="265" height="66" rx="8" class="c-backend" stroke-width="1.5"/>
    <text x="462.5" y="51" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Tier 1: MDE AadDeviceId</text>
    <text x="462.5" y="67" class="t-muted" font-size="9" text-anchor="middle">DeviceInfo.AadDeviceId == Entra deviceId</text>
    <text x="462.5" y="81" class="t-backend" font-size="7.5" font-weight="600" text-anchor="middle">Primary · Entra / Hybrid Joined Servers</text>
  </g>

  <!-- Node 3: Tier 2 Machine Configuration -->
  <g id="node-tier2_gc">
    <rect x="330" y="126" width="265" height="66" rx="8" class="c-mask"/>
    <rect x="330" y="126" width="265" height="66" rx="8" class="c-messagebus" stroke-width="1.5"/>
    <text x="462.5" y="147" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Tier 2: Machine Configuration</text>
    <text x="462.5" y="163" class="t-muted" font-size="9" text-anchor="middle">GuestConfigurationResources intuneDeviceId</text>
    <text x="462.5" y="177" class="t-messagebus" font-size="7.5" font-weight="600" text-anchor="middle">SenseCM EnrollmentPayload / wdavstate</text>
  </g>

  <!-- Node 4: Tier 3 MDE Synthetic Device ID -->
  <g id="node-tier3_syn">
    <rect x="330" y="222" width="265" height="66" rx="8" class="c-mask"/>
    <rect x="330" y="222" width="265" height="66" rx="8" class="c-cloud" stroke-width="1.5"/>
    <text x="462.5" y="243" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Tier 3: MDE Synthetic Device ID</text>
    <text x="462.5" y="259" class="t-muted" font-size="9" text-anchor="middle">SHA-256 Folded SenseId == Entra deviceId</text>
    <text x="462.5" y="273" class="t-cloud" font-size="7.5" font-weight="600" text-anchor="middle">Get-MdeSyntheticDeviceId · Deterministic GUID</text>
  </g>

  <!-- Node 5: Tier 4 MicrosoftSense Fallback -->
  <g id="node-tier4_sense">
    <rect x="330" y="318" width="265" height="66" rx="8" class="c-mask"/>
    <rect x="330" y="318" width="265" height="66" rx="8" class="c-security" stroke-width="1.5"/>
    <text x="462.5" y="339" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Tier 4: MicrosoftSense Fallback</text>
    <text x="462.5" y="355" class="t-muted" font-size="9" text-anchor="middle">displayName == Hostname &amp; OS Match</text>
    <text x="462.5" y="369" class="t-security" font-size="7.5" font-weight="600" text-anchor="middle">Fallback · managementType == MicrosoftSense</text>
  </g>

  <!-- Node 6: Verified Entra ID Device -->
  <g id="node-entra_device">
    <rect x="690" y="175" width="235" height="66" rx="8" class="c-mask"/>
    <rect x="690" y="175" width="235" height="66" rx="8" class="c-security" stroke-width="1.5"/>
    <text x="807.5" y="198" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">2. Verified Entra ID Device</text>
    <text x="807.5" y="214" class="t-muted" font-size="9" text-anchor="middle">GET /v1.0/devices (Exact Match == 1)</text>
    <text x="807.5" y="228" class="t-security" font-size="7.5" font-weight="600" text-anchor="middle">accountEnabled == true · Entra Object ID</text>
  </g>

  <!-- Node 7: Cloud x OS Group -->
  <g id="node-au_group">
    <rect x="995" y="175" width="225" height="66" rx="8" class="c-mask"/>
    <rect x="995" y="175" width="225" height="66" rx="8" class="c-frontend" stroke-width="1.5"/>
    <text x="1107.5" y="198" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">3. Cloud account Security Group</text>
    <text x="1107.5" y="214" class="t-muted" font-size="9" text-anchor="middle">Administrative Unit Group Sync</text>
    <text x="1107.5" y="228" class="t-frontend" font-size="7.5" font-weight="600" text-anchor="middle">dfs-{cloud}-{id}-{os}-{mode}</text>
  </g>
</svg>
